<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline Markdown Reader</title>
    <meta name="description" content="A private, self-contained Markdown reader that works entirely offline.">
    <meta name="theme-color" content="#000000">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>M</text></svg>">
    <script>
        try {
            const savedTheme = localStorage.getItem("theme");
            const useDarkTheme = savedTheme
                ? savedTheme === "dark"
                : matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = useDarkTheme ? "dark" : "light";
        } catch {
            document.documentElement.dataset.theme = "dark";
        }
    </script>
    <style>
        :root {
            --theme-black: #000000;
            --theme-light-gray: #f5f5f7;
            --theme-white: #ffffff;

            --bg-color: var(--theme-black);
            --text-color: var(--theme-white);
            --card-bg: rgba(28, 28, 30, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-hover: rgba(44, 44, 46, 0.8);
            --btn-bg: var(--theme-white);
            --btn-text: var(--theme-black);
            --btn-hover: #e0e0e0;
            --divider: rgba(255, 255, 255, 0.08);
            --text-muted: rgba(255, 255, 255, 0.5);
            --code-bg: rgba(20, 20, 20, 0.95);
            --selection-bg: rgba(255, 255, 255, 0.22);
        }

        [data-theme="light"] {
            --bg-color: var(--theme-light-gray);
            --text-color: var(--theme-black);
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(0, 0, 0, 0.1);
            --card-hover: rgba(255, 255, 255, 0.9);
            --btn-bg: var(--theme-black);
            --btn-text: var(--theme-white);
            --btn-hover: #333333;
            --divider: rgba(0, 0, 0, 0.08);
            --text-muted: rgba(0, 0, 0, 0.6);
            --code-bg: rgba(20, 20, 20, 0.95);
            --selection-bg: rgba(0, 0, 0, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        ::selection {
            background: var(--selection-bg);
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        [hidden] {
            display: none !important;
        }

        .header-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .logo,
        .theme-toggle {
            pointer-events: auto;
        }

        .logo {
            color: var(--text-color);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            transition: color 0.5s ease, opacity 0.3s ease;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            width: 44px;
            height: 44px;
            margin: -8px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.5s ease, opacity 0.3s ease;
        }

        .logo:hover,
        .theme-toggle:hover {
            opacity: 0.6;
        }

        .logo:focus-visible,
        .theme-toggle:focus-visible,
        .primary-btn:focus-visible,
        .toolbar-btn:focus-visible {
            outline: 2px solid var(--text-color);
            outline-offset: 4px;
        }

        .theme-toggle svg {
            width: 28px;
            height: 28px;
        }

        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 20px 80px;
        }

        .hero-title {
            font-size: clamp(3.5rem, 11vw, 9rem);
            line-height: 0.92;
            letter-spacing: -0.05em;
            font-weight: 700;
            margin-bottom: 44px;
        }

        .primary-btn {
            min-height: 48px;
            padding: 13px 26px;
            border-radius: 30px;
            border: none;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .primary-btn:hover {
            background-color: var(--btn-hover);
        }

        .primary-btn:active {
            transform: scale(0.97);
        }

        .document-shell {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 128px 28px 100px;
        }

        .document-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 56px;
            padding: 18px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
        }

        .file-details {
            min-width: 0;
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }

        .file-name {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toolbar-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .toolbar-btn {
            min-height: 44px;
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--text-color);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .toolbar-btn:hover {
            background: var(--card-hover);
        }

        .toolbar-btn:active {
            transform: scale(0.97);
        }

        .markdown-body {
            overflow-wrap: anywhere;
            font-size: 1rem;
            line-height: 1.75;
        }

        .markdown-body > :first-child {
            margin-top: 0;
        }

        .markdown-body > :last-child {
            margin-bottom: 0;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.15;
            text-wrap: balance;
        }

        .markdown-body h1 {
            font-size: clamp(2.4rem, 6vw, 4.5rem);
            margin: 0 0 36px;
        }

        .markdown-body h2 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            margin: 72px 0 24px;
            padding-top: 4px;
        }

        .markdown-body h3 {
            font-size: 1.45rem;
            margin: 48px 0 18px;
        }

        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            font-size: 1.05rem;
            margin: 36px 0 14px;
        }

        .markdown-body p {
            margin: 0 0 22px;
            opacity: 0.85;
        }

        .markdown-body strong {
            font-weight: 650;
            opacity: 1;
        }

        .markdown-body a {
            position: relative;
            color: inherit;
            text-decoration-color: var(--text-muted);
            text-underline-offset: 0.2em;
            transition: text-decoration-color 0.3s ease;
        }

        .markdown-body a:hover {
            text-decoration-color: currentColor;
        }

        .markdown-body a[data-link-preview]::after {
            content: attr(data-link-preview);
            position: absolute;
            left: 0;
            bottom: calc(100% + 10px);
            z-index: 20;
            width: max-content;
            max-width: min(280px, calc(100vw - 40px));
            padding: 8px 11px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: var(--text-color);
            color: var(--bg-color);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
            font-size: 0.75rem;
            font-weight: 500;
            line-height: 1.3;
            text-overflow: ellipsis;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transform: translateY(4px);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
            pointer-events: none;
        }

        .markdown-body a[data-link-preview]:hover::after,
        .markdown-body a[data-link-preview]:focus-visible::after {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .markdown-body ul,
        .markdown-body ol {
            margin: 0 0 24px;
            padding-left: 1.55rem;
        }

        .markdown-body li {
            margin: 7px 0;
            padding-left: 0.25rem;
            opacity: 0.85;
        }

        .markdown-body li::marker {
            color: var(--text-muted);
        }

        .task-item {
            list-style: none;
            margin-left: -1.3rem !important;
        }

        .task-item input {
            width: 16px;
            height: 16px;
            margin-right: 10px;
            vertical-align: -2px;
            accent-color: var(--text-color);
        }

        .markdown-body blockquote {
            margin: 36px 0;
            padding: 2px 0 2px 24px;
            border-left: 1px solid var(--text-muted);
            font-size: 1.1rem;
        }

        .markdown-body blockquote p {
            margin-bottom: 12px;
        }

        .markdown-body hr {
            border: 0;
            height: 1px;
            margin: 56px 0;
            background: var(--divider);
        }

        .markdown-body code {
            font-family: "SF Mono", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.85em;
        }

        .markdown-body :not(pre) > code {
            padding: 0.2em 0.45em;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
        }

        .markdown-body pre {
            position: relative;
            margin: 32px 0;
            padding: 22px;
            background: var(--code-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #d1d1d6;
            font-family: "SF Mono", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.85rem;
            line-height: 1.65;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            white-space: pre;
        }

        .markdown-body pre[data-language]::before {
            content: attr(data-language);
            display: block;
            margin-bottom: 14px;
            color: #a1a1a6;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .table-wrap {
            width: 100%;
            margin: 32px 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid var(--card-border);
            border-radius: 12px;
        }

        .markdown-body table {
            width: 100%;
            min-width: 480px;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .markdown-body th,
        .markdown-body td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--divider);
        }

        .markdown-body th {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            background: var(--card-bg);
        }

        .markdown-body td {
            opacity: 0.85;
        }

        .markdown-body tr:last-child td {
            border-bottom: none;
        }

        .embedded-image {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 32px auto;
            border-radius: 20px;
            border: 1px solid var(--card-border);
        }

        .blocked-image,
        .blocked-link {
            display: inline-flex;
            align-items: center;
            max-width: 100%;
            padding: 0.25em 0.6em;
            border: 1px solid var(--card-border);
            border-radius: 999px;
            color: var(--text-muted);
            font-size: 0.8em;
            line-height: 1.4;
            vertical-align: middle;
        }

        .blocked-image::before {
            content: "Image blocked · ";
            margin-right: 0.25em;
        }

        .blocked-link {
            text-decoration: line-through;
            text-decoration-thickness: 1px;
        }

        .drop-overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            pointer-events: none;
        }

        .drop-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .drop-overlay-message {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            text-align: center;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: max(28px, env(safe-area-inset-bottom));
            z-index: 400;
            max-width: calc(100vw - 40px);
            padding: 12px 18px;
            transform: translate(-50%, 16px);
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
        }

        .toast.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        .footer {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0.3;
            padding: 20px 0 40px;
        }

        @media (max-width: 768px) {
            .header-nav {
                padding: 20px;
            }

            .hero-section {
                padding: 100px 20px 60px;
            }

            .document-shell {
                padding: 104px 20px 70px;
            }

            .document-toolbar {
                align-items: stretch;
                flex-direction: column;
                margin-bottom: 44px;
            }

            .toolbar-actions {
                width: 100%;
            }

            .toolbar-btn {
                flex: 1;
            }

            .markdown-body h1 {
                font-size: clamp(2.2rem, 12vw, 3.5rem);
            }
        }

        @media (max-width: 380px) {
            .hero-title {
                font-size: 3rem;
            }

            .toolbar-actions {
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media print {
            :root,
            [data-theme="light"] {
                --bg-color: #ffffff;
                --text-color: #000000;
                --text-muted: rgba(0, 0, 0, 0.55);
                --divider: rgba(0, 0, 0, 0.12);
                --card-border: rgba(0, 0, 0, 0.12);
            }

            .header-nav,
            .document-toolbar,
            .footer,
            .toast,
            .drop-overlay {
                display: none !important;
            }

            body {
                background: #ffffff;
                color: #000000;
            }

            .document-shell {
                max-width: none;
                padding: 0;
            }

            .markdown-body a {
                text-decoration: underline;
            }

            .markdown-body pre,
            .table-wrap,
            blockquote {
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <nav class="header-nav" aria-label="Application">
        <a href="./index.html" class="logo" title="Start over">MD Reader</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
            <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path class="sun-path"
                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                </path>
            </svg>
        </button>
    </nav>

    <main>
        <section class="hero-section" id="empty-state" aria-labelledby="hero-title">
            <h1 class="hero-title" id="hero-title">Drop Markdown.</h1>
            <button class="primary-btn" id="choose-file" type="button">Choose a file</button>
        </section>

        <section class="document-shell" id="document-view" aria-live="polite" hidden>
            <div class="document-toolbar">
                <div class="file-details">
                    <div class="section-label">Now reading</div>
                    <div class="file-name" id="file-name"></div>
                </div>
                <div class="toolbar-actions">
                    <button class="toolbar-btn" id="open-another" type="button">Open another</button>
                    <button class="toolbar-btn" id="print-document" type="button">Print / PDF</button>
                </div>
            </div>

            <article class="markdown-body" id="markdown-content"></article>
            <footer class="footer">Offline Markdown Reader</footer>
        </section>
    </main>

    <input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>

    <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
        <div class="drop-overlay-message">Drop to read.</div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        (function () {
            "use strict";

            const MAX_FILE_SIZE = 10 * 1024 * 1024;
            const FILE_PATTERN = /\.(md|markdown|txt)$/i;
            const motionAllowed = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            const fileInput = document.getElementById("file-input");
            const chooseFileButton = document.getElementById("choose-file");
            const openAnotherButton = document.getElementById("open-another");
            const printButton = document.getElementById("print-document");
            const dropOverlay = document.getElementById("drop-overlay");
            const emptyState = document.getElementById("empty-state");
            const documentView = document.getElementById("document-view");
            const markdownContent = document.getElementById("markdown-content");
            const fileName = document.getElementById("file-name");
            const toast = document.getElementById("toast");
            const entityDecoder = document.createElement("textarea");
            let dragDepth = 0;
            let toastTimer = 0;

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;")
                    .replace(/\uE000/g, "&#57344;")
                    .replace(/\uE001/g, "&#57345;");
            }

            function decodeEntities(value) {
                entityDecoder.innerHTML = value;
                return entityDecoder.value;
            }

            function cleanUrl(value) {
                return decodeEntities(value).trim().replace(/[\u0000-\u001F\u007F\s]+/g, "");
            }

            function safeLinkUrl(value) {
                const cleaned = cleanUrl(value);
                if (/^#[A-Za-z0-9_.:-]+$/.test(cleaned)) return cleaned;
                if (/^(https?:|mailto:)/i.test(cleaned)) return cleaned;
                return "";
            }

            function linkPreview(url) {
                if (/^mailto:/i.test(url)) {
                    return "Email · " + url.slice(7).split("?")[0];
                }
                try {
                    return "Public internet · " + new URL(url).hostname.replace(/^www\./i, "");
                } catch {
                    return "";
                }
            }

            function safeImageUrl(value) {
                const cleaned = cleanUrl(value);
                if (/^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+/=\r\n]+$/i.test(cleaned)) {
                    return cleaned;
                }
                return "";
            }

            function applyEmphasis(value) {
                return value
                    .replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>")
                    .replace(/___(.+?)___/g, "<strong><em>$1</em></strong>")
                    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                    .replace(/__(.+?)__/g, "<strong>$1</strong>")
                    .replace(/\*(.+?)\*/g, "<em>$1</em>")
                    .replace(/(^|[^A-Za-z0-9])_(.+?)_(?![A-Za-z0-9])/g, "$1<em>$2</em>")
                    .replace(/~~(.+?)~~/g, "<del>$1</del>");
            }

            function parseInline(source) {
                let result = escapeHtml(source);
                const held = [];
                const hold = function (fragment) {
                    const index = held.push(fragment) - 1;
                    return "\uE000" + index + "\uE001";
                };

                result = result.replace(/`([^`]+)`/g, function (_, code) {
                    return hold("<code>" + code + "</code>");
                });

                result = result.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function (_, alt, src) {
                    const safe = safeImageUrl(src);
                    if (!safe) {
                        return hold("<span class=\"blocked-image\" title=\"Only embedded PNG, JPEG, GIF, and WebP images are shown offline\">" + (alt || "Untitled image") + "</span>");
                    }
                    return hold("<img class=\"embedded-image\" src=\"" + escapeHtml(safe) + "\" alt=\"" + alt + "\">");
                });

                result = result.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, label, href) {
                    const safe = safeLinkUrl(href);
                    const formattedLabel = applyEmphasis(label);
                    if (!safe) {
                        return hold("<span class=\"blocked-link\" title=\"Unsafe or unsupported link blocked\">" + formattedLabel + "</span>");
                    }
                    const preview = linkPreview(safe);
                    const accessibleLabel = decodeEntities(label).replace(/[*_~`]/g, "");
                    const external = preview
                        ? [
                            " target=\"_blank\"",
                            " rel=\"noopener noreferrer\"",
                            " data-link-preview=\"" + escapeHtml(preview) + "\"",
                            " aria-label=\"" + escapeHtml(accessibleLabel + " — " + preview) + "\""
                        ].join("")
                        : "";
                    return hold("<a href=\"" + escapeHtml(safe) + "\"" + external + ">" + formattedLabel + "</a>");
                });

                result = applyEmphasis(result);

                return result.replace(/\uE000([0-9]+)\uE001/g, function (_, index) {
                    return held[Number(index)] || "";
                });
            }

            function splitTableRow(line) {
                return line
                    .replace(/^\s*\|/, "")
                    .replace(/\|\s*$/, "")
                    .split("|")
                    .map(function (cell) { return cell.trim(); });
            }

            function isTableSeparator(line) {
                const cells = splitTableRow(line);
                return cells.length > 0 && cells.every(function (cell) {
                    return /^:?-{3,}:?$/.test(cell);
                });
            }

            // Deliberate subset: common text styles, links, data images, code,
            // lists, tasks, quotes, rules, and tables. Raw HTML remains text.
            function renderMarkdown(markdown) {
                const lines = String(markdown).replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n").split("\n");
                const html = [];
                let paragraph = [];
                let listType = "";
                let inBlockquote = false;
                let i = 0;

                function flushParagraph() {
                    if (!paragraph.length) return;
                    const last = paragraph.length - 1;
                    const body = paragraph.map(function (raw, index) {
                        const hardBreak = index < last && /( {2,}|\\)$/.test(raw);
                        const cleaned = raw.replace(/\s+$/, "").replace(/\\$/, "");
                        return parseInline(cleaned) + (hardBreak ? "<br>" : "");
                    }).join("\n");
                    html.push("<p>" + body + "</p>");
                    paragraph = [];
                }

                function closeList() {
                    if (!listType) return;
                    html.push("</" + listType + ">");
                    listType = "";
                }

                function closeBlockquote() {
                    if (!inBlockquote) return;
                    html.push("</blockquote>");
                    inBlockquote = false;
                }

                while (i < lines.length) {
                    const line = lines[i];
                    const fence = line.match(/^\s*(`{3,}|~{3,})\s*([^\s`]*)\s*$/);

                    if (fence) {
                        flushParagraph();
                        closeList();
                        closeBlockquote();
                        const marker = fence[1].charAt(0);
                        const minimum = fence[1].length;
                        const language = fence[2].replace(/[^A-Za-z0-9_+.#-]/g, "").slice(0, 30);
                        const codeLines = [];
                        i += 1;
                        while (i < lines.length && !(new RegExp("^\\s*" + marker + "{" + minimum + ",}\\s*$")).test(lines[i])) {
                            codeLines.push(lines[i]);
                            i += 1;
                        }
                        html.push("<pre" + (language ? " data-language=\"" + escapeHtml(language) + "\"" : "") + "><code>" + escapeHtml(codeLines.join("\n")) + "</code></pre>");
                        i += 1;
                        continue;
                    }

                    const heading = line.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
                    if (heading) {
                        flushParagraph();
                        closeList();
                        closeBlockquote();
                        const level = heading[1].length;
                        html.push("<h" + level + ">" + parseInline(heading[2]) + "</h" + level + ">");
                        i += 1;
                        continue;
                    }

                    if (/^\s{0,3}((\*\s*){3,}|(-\s*){3,}|(_\s*){3,})$/.test(line)) {
                        flushParagraph();
                        closeList();
                        closeBlockquote();
                        html.push("<hr>");
                        i += 1;
                        continue;
                    }

                    if (line.includes("|") && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
                        flushParagraph();
                        closeList();
                        closeBlockquote();
                        const headers = splitTableRow(line);
                        const table = ["<div class=\"table-wrap\"><table><thead><tr>"];
                        headers.forEach(function (cell) { table.push("<th>" + parseInline(cell) + "</th>"); });
                        table.push("</tr></thead><tbody>");
                        i += 2;
                        while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
                            const cells = splitTableRow(lines[i]);
                            table.push("<tr>");
                            for (let c = 0; c < headers.length; c += 1) {
                                table.push("<td>" + parseInline(cells[c] || "") + "</td>");
                            }
                            table.push("</tr>");
                            i += 1;
                        }
                        table.push("</tbody></table></div>");
                        html.push(table.join(""));
                        continue;
                    }

                    const list = line.match(/^\s{0,3}([-+*]|\d+[.)])\s+(.+)$/);
                    if (list) {
                        flushParagraph();
                        closeBlockquote();
                        const nextType = /^\d/.test(list[1]) ? "ol" : "ul";
                        if (listType !== nextType) {
                            closeList();
                            html.push("<" + nextType + ">");
                            listType = nextType;
                        }
                        const task = list[2].match(/^\[([ xX])\]\s+(.*)$/);
                        if (task) {
                            html.push("<li class=\"task-item\"><input type=\"checkbox\" disabled" + (/x/i.test(task[1]) ? " checked" : "") + ">" + parseInline(task[2]) + "</li>");
                        } else {
                            html.push("<li>" + parseInline(list[2]) + "</li>");
                        }
                        i += 1;
                        continue;
                    }

                    if (/^\s*>/.test(line)) {
                        flushParagraph();
                        closeList();
                        if (!inBlockquote) {
                            html.push("<blockquote>");
                            inBlockquote = true;
                        }
                        html.push("<p>" + parseInline(line.replace(/^\s*>\s?/, "")) + "</p>");
                        i += 1;
                        continue;
                    }

                    if (line.trim() === "") {
                        flushParagraph();
                        closeList();
                        closeBlockquote();
                        i += 1;
                        continue;
                    }

                    closeList();
                    closeBlockquote();
                    paragraph.push(line);
                    i += 1;
                }

                flushParagraph();
                closeList();
                closeBlockquote();
                return html.join("\n");
            }

            if (location.hash === "#self-test") {
                [
                    ["# Title", "<h1>Title</h1>"],
                    ["**Bold** and `code`", "<strong>Bold</strong> and <code>code</code>"],
                    ["<img src=x onerror=alert(1)>", "&lt;img src=x onerror=alert(1)&gt;"],
                    ["[unsafe](javascript:alert(1))", "blocked-link"],
                    ["[encoded](jav&#x61;script:alert(1))", "blocked-link"],
                    ["![remote](https://example.com/image.png)", "blocked-image"],
                    ["[Web](https://www.example.com/page)", "data-link-preview=\"Public internet · example.com\""],
                    ["[Email](mailto:hello@example.com)", "data-link-preview=\"Email · hello@example.com\""],
                    ["```js\nalert(1);\n```", "<pre data-language=\"js\"><code>alert(1);</code></pre>"],
                    ["- [x] Done", "type=\"checkbox\" disabled checked"],
                    ["> Quoted", "<blockquote><p>Quoted</p></blockquote>"],
                    ["| A |\n| --- |\n| B |", "<table>"]
                ].forEach(function (test, index) {
                    if (!renderMarkdown(test[0]).includes(test[1])) {
                        throw new Error("Markdown self-test " + (index + 1) + " failed.");
                    }
                });
                console.info("Markdown self-test passed.");
            }

            function showToast(message) {
                window.clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add("visible");
                toastTimer = window.setTimeout(function () {
                    toast.classList.remove("visible");
                }, 2800);
            }

            function animateIn(elements) {
                if (!motionAllowed) return;
                elements.forEach(function (element, index) {
                    if (!element || typeof element.animate !== "function") return;
                    element.animate(
                        [
                            { opacity: 0, transform: "translateY(30px)" },
                            { opacity: 1, transform: "translateY(0)" }
                        ],
                        {
                            duration: 900,
                            delay: 120 + index * 90,
                            easing: "cubic-bezier(0.25, 1, 0.5, 1)",
                            fill: "both"
                        }
                    );
                });
            }

            function validateFile(file) {
                if (!file) return "No file selected.";
                if (file.size > MAX_FILE_SIZE) return "That file is larger than 10 MB.";
                if (!FILE_PATTERN.test(file.name) && !/^text\/(plain|(?:x-)?markdown)$/i.test(file.type || "")) {
                    return "Choose a Markdown or plain-text file.";
                }
                return "";
            }

            async function renderFile(file) {
                const problem = validateFile(file);
                if (problem) {
                    showToast(problem);
                    return;
                }

                try {
                    const source = await file.text();
                    markdownContent.innerHTML = renderMarkdown(source);
                    fileName.textContent = file.name;
                    document.title = file.name + " — Offline Markdown Reader";
                    emptyState.hidden = true;
                    documentView.hidden = false;
                    window.scrollTo(0, 0);
                    animateIn([document.querySelector(".document-toolbar"), markdownContent]);
                } catch {
                    showToast("The browser could not read that file.");
                }
            }

            function openPicker() {
                fileInput.value = "";
                fileInput.click();
            }

            chooseFileButton.addEventListener("click", openPicker);
            openAnotherButton.addEventListener("click", openPicker);
            printButton.addEventListener("click", function () { window.print(); });
            fileInput.addEventListener("change", function () {
                renderFile(fileInput.files[0]);
            });

            ["dragenter", "dragover", "dragleave", "drop"].forEach(function (eventName) {
                document.addEventListener(eventName, function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                });
            });

            document.addEventListener("dragenter", function (event) {
                if (!event.dataTransfer || !Array.from(event.dataTransfer.types || []).includes("Files")) return;
                dragDepth += 1;
                dropOverlay.classList.add("visible");
            });

            document.addEventListener("dragleave", function () {
                dragDepth = Math.max(0, dragDepth - 1);
                if (dragDepth === 0) {
                    dropOverlay.classList.remove("visible");
                }
            });

            document.addEventListener("drop", function (event) {
                dragDepth = 0;
                dropOverlay.classList.remove("visible");
                renderFile(event.dataTransfer && event.dataTransfer.files[0]);
            });

            animateIn([
                document.querySelector(".hero-title"),
                chooseFileButton
            ]);

            const themeButton = document.getElementById("theme-toggle");
            const themeIcon = document.getElementById("theme-icon");
            const themePath = themeIcon.querySelector("path");
            const themeColor = document.querySelector('meta[name="theme-color"]');
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
            const icons = {
                dark: "M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z",
                light: "M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"
            };

            function readTheme() {
                try { return localStorage.getItem("theme"); } catch (error) { return null; }
            }

            function applyTheme(dark, animate) {
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
                themeColor.content = dark ? "#000000" : "#f5f5f7";
                themePath.setAttribute("d", dark ? icons.dark : icons.light);
                themeButton.setAttribute("aria-label", dark ? "Use light theme" : "Use dark theme");

                if (animate && motionAllowed && typeof themeIcon.animate === "function") {
                    themeIcon.animate(
                        [{ transform: "rotate(0deg) scale(0.8)" }, { transform: "rotate(360deg) scale(1)" }],
                        { duration: 600, easing: "cubic-bezier(0.33, 1, 0.68, 1)" }
                    );
                }
            }

            let isDark = document.documentElement.dataset.theme === "dark";
            applyTheme(isDark, false);
            themeButton.addEventListener("click", function () {
                isDark = !isDark;
                try { localStorage.setItem("theme", isDark ? "dark" : "light"); } catch (error) {}
                applyTheme(isDark, true);
            });
            prefersDark.addEventListener("change", function (event) {
                if (readTheme()) return;
                isDark = event.matches;
                applyTheme(isDark, true);
            });
        })();
    </script>
</body>
</html>
